[project]
name = "matrix"
version = "0.1.0"
description = "UAV video-to-3D geospatial reconstruction system"
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy>=1.25.0",
    "pydantic>=2.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]